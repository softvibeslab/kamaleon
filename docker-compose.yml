# ════════════════════════════════════════════════════════════════
#                    Kamaleon Development Stack
#                    Docker Compose Configuration
# ════════════════════════════════════════════════════════════════

version: '3.8'

services:
  # ────────────────────────────────────────────────────────────────
  # PostgreSQL Database
  # ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: kamaleon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kamaleon
      POSTGRES_PASSWORD: kamaleon_dev_123
      POSTGRES_DB: kamaleon
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kamaleon"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ────────────────────────────────────────────────────────────────
  # Redis Cache
  # ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: kamaleon-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ────────────────────────────────────────────────────────────────
  # API Gateway
  # ────────────────────────────────────────────────────────────────
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: kamaleon-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      GATEWAY_PORT: 3000
      DASHBOARD_URL: http://dashboard-backend:3001
      SYNC_URL: http://dashboard-backend:3001
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: kamaleon-dev-jwt-secret-change-in-production
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    depends_on:
      redis:
        condition: service_healthy
      dashboard-backend:
        condition: service_healthy

  # ────────────────────────────────────────────────────────────────
  # Dashboard Backend
  # ────────────────────────────────────────────────────────────────
  dashboard-backend:
    build:
      context: ./dashboard/backend
      dockerfile: Dockerfile
    container_name: kamaleon-dashboard-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://kamaleon:kamaleon_dev_123@postgres:5432/kamaleon
      JWT_SECRET: kamaleon-dev-jwt-secret-change-in-production
      JWT_EXPIRES_IN: 8h
      JWT_REFRESH_EXPIRES_IN: 7d
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ────────────────────────────────────────────────────────────────
  # Dashboard Frontend
  # ────────────────────────────────────────────────────────────────
  dashboard-frontend:
    build:
      context: ./dashboard/frontend
      dockerfile: Dockerfile
    container_name: kamaleon-dashboard-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000/api/dashboard
    depends_on:
      - gateway
    volumes:
      - ./dashboard/frontend/src:/app/src:ro

  # ────────────────────────────────────────────────────────────────
  # Adminer (Database Management)
  # ────────────────────────────────────────────────────────────────
  adminer:
    image: adminer:4
    container_name: kamaleon-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: kamaleon-network
